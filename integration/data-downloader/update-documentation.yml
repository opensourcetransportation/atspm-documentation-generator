name: Update generated documentation

on:
  workflow_dispatch:
  push:
    branches: [documentation-integration]
    paths-ignore:
      - 'docs/autogenerated/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  documentation:
    # Test this pushed branch now; replace with a reviewed full commit SHA to pin the version.
    uses: opensourcetransportation/atspm-documentation-generator/.github/workflows/documentation-pr.yml@main
    with:
      source-branch: documentation-integration
      target-branch: documentation-integration
      create-pr: true
      # autoDiscover includes new sections without rewriting the map.
