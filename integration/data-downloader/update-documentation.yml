name: Update generated documentation

on:
  workflow_dispatch:
  push:
    branches: [documentation-integration]
    paths-ignore:
      - 'docs/autogenerated/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  documentation:
    # Replace BOTH pins after the shared generator changes have been reviewed
    # and pushed to a development branch. No main-branch merge is required.
    uses: opensourcetransportation/atspm-documentation-generator/.github/workflows/documentation-pr.yml@REPLACE_WITH_COMMIT_SHA
    with:
      generator-ref: REPLACE_WITH_COMMIT_SHA
      source-branch: documentation-integration
      target-branch: documentation-integration
      create-pr: false
      # autoDiscover includes new sections without rewriting the map.
      # After reviewing the first hosted preview, set create-pr: true.
