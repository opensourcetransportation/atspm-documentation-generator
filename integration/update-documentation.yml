name: Update generated documentation

on:
  workflow_dispatch:
  push:
    branches: [documentation-integration]
    paths-ignore:
      - 'docs/autogenerated/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  documentation:
    uses: opensourcetransportation/atspm-documentation-generator/.github/workflows/documentation-pr.yml@REPLACE_WITH_COMMIT_SHA
    with:
      generator-ref: REPLACE_WITH_COMMIT_SHA
      source-branch: documentation-integration
      target-branch: documentation-integration
      # First run is an artifact-only preview. Enable draft PRs after review.
      create-pr: false
      # Defaults: GenerateDocuments/documentation.json and docs/autogenerated.
      # For an explicit map, optionally assign new sections to ONE chosen page:
      # sync-container: configuration
