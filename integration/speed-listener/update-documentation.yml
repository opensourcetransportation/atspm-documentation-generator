name: Update generated documentation

on:
  workflow_dispatch:
  push:
    branches: [documentation-integration]
    paths-ignore:
      - 'docs/autogenerated/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  documentation:
    # Replace both pins with the same reviewed, pushed generator commit.
    uses: opensourcetransportation/atspm-documentation-generator/.github/workflows/documentation-pr.yml@REPLACE_WITH_COMMIT_SHA
    with:
      generator-ref: REPLACE_WITH_COMMIT_SHA
      source-branch: documentation-integration
      target-branch: documentation-integration
      create-pr: false
      # Explicit pages make a new section fail coverage until its role is known.
