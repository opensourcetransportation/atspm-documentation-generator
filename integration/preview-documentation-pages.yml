name: Preview committed documentation site

on:
  workflow_dispatch:
  push:
    branches: [documentation-integration]
    paths:
      - 'docs/autogenerated/**'
      - 'GenerateDocuments/documentation.json'
      - '.github/workflows/preview-documentation-pages.yml'

permissions:
  contents: read

jobs:
  pages:
    uses: opensourcetransportation/atspm-documentation-generator/.github/workflows/documentation-pages.yml@REPLACE_WITH_COMMIT_SHA
    with:
      generator-ref: REPLACE_WITH_COMMIT_SHA
      docs-branch: documentation-integration
      publish: false
      # Defaults: GenerateDocuments/documentation.json and docs/autogenerated.
