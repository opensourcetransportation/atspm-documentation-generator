name: Update autogenerated documentation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/autogenerated/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  documentation:
    # Change @main to @<full-commit-sha> to pin a generator version.
    uses: opensourcetransportation/atspm-documentation-generator/.github/workflows/documentation-pr.yml@main
    with:
      source-branch: main
      target-branch: main
      create-pr: true
      # Preserve service-specific assignments; do not guess where new shared
      # ATSPM configuration sections belong.
