name: Update autogenerated documentation

on:
  workflow_dispatch:
  push:
    branches: [Code-Documentations]
    paths-ignore:
      - 'docs/autogenerated/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  documentation:
    uses: opensourcetransportation/atspm-documentation-generator/.github/workflows/documentation-pr.yml@REPLACE_WITH_COMMIT_SHA
    with:
      generator-ref: REPLACE_WITH_COMMIT_SHA
      source-branch: Code-Documentations
      target-branch: Code-Documentations
      create-pr: false
      # Preserve service-specific assignments; do not guess where new shared
      # ATSPM configuration sections belong.
